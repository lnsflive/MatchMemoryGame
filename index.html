<!DOCTYPE html>
<html>
  <head>
    <script>
      // Preserve provider return parameters before the hash router normalizes the URL.
      const authQuery = new URLSearchParams(window.location.search)
      if (['state', 'access_token', 'error'].some(key => authQuery.has(key))) {
        window.__memoryAuthReturn = window.location.search
        window.history.replaceState(null, '', window.location.pathname + window.location.hash)
      }
    </script>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=2">
    <link rel="icon" type="image/svg+xml" sizes="any" href="icons/match-memory.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
